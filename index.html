<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALVEO Design Interior</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: white;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.35)
                ),
                url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            min-height: 100vh;
        }

        /* ШАПКА */

        header {
            padding: 30px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 30px;
            letter-spacing: 7px;
            font-weight: 300;
        }

        .subtitle {
            font-size: 9px;
            letter-spacing: 4px;
            margin-top: 5px;
            opacity: 0.8;
        }

        /* МЕНЮ */

        nav {
            display: flex;
            gap: 8px;
        }

        nav a {
            text-decoration: none;
            color: white;

            background: rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.35);

            padding: 10px 17px;

            border-radius: 12px;

            transition: 0.3s;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* ГЛАВНЫЙ ЭКРАН */

        .hero {
            min-height: 78vh;

            display: flex;
            align-items: center;

            padding: 40px 7%;
        }

        .hero-content {
            max-width: 750px;
        }

        .hero h1 {
            font-size: 72px;
            line-height: 1.05;
            font-weight: 300;
            letter-spacing: 2px;

            margin-bottom: 25px;
        }

        .hero p {
            font-size: 19px;
            line-height: 1.6;

            color: white;

            max-width: 550px;

            background: rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            padding: 12px 18px;

            border-radius: 8px;

            margin-bottom: 30px;
        }

        /* КНОПКА */

        .button {
            display: inline-block;

            color: white;
            text-decoration: none;

            background: rgba(255, 255, 255, 0.16);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.4);

            padding: 16px 28px;

            border-radius: 12px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.2);

            transition: 0.3s;
        }

        .button:hover {
            background: rgba(255, 255, 255, 0.3);

            transform: translateY(-3px);
        }

        /* ТЕЛЕФОН */

        @media (max-width: 700px) {

            header {
                padding: 25px;
            }

            nav {
                display: none;
            }

            .hero {
                padding: 30px 25px;
            }

            .hero h1 {
                font-size: 48px;
            }

            .hero p {
                font-size: 16px;
            }

            .logo {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="brand">
            <div class="logo">ALVEO</div>
            <div class="subtitle">DESIGN INTERIOR</div>
        </div>

        <nav>
            <a href="#">Главная</a>
            <a href="#">Проекты</a>
            <a href="#">Обо мне</a>
            <a href="#">Контакты</a>
        </nav>

    </header>


    <section class="hero">

        <div class="hero-content">

            <h1>
                Spaces<br>
                that inspire.
            </h1>

    <p>
    Пространство, в котором хочется жить.
</p>

            <a href="#" class="button">
                Посмотреть проекты
            </a>

        </div>

    </section>

</body>
</html>
